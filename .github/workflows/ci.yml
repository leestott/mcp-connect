name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Provision and deploy to Microsoft Foundry after validation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate (tests, decks, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test/build dependencies
        working-directory: caldova-recall-control
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run test suite
        working-directory: caldova-recall-control
        run: python -m pytest tests -q

      - name: Build presentation decks
        working-directory: caldova-recall-control/presentation
        run: |
          python build_deck.py
          python build_teams_deck.py
          python build_event_deck.py
            python build_story_deck.py

      - name: Check public repository files
        run: python scripts/check_repository.py

      - name: Check committed snapshot
        run: python scripts/check_repository.py --staged

      - name: Validate azd manifest is present
        run: test -f azure.yaml && echo "azure.yaml present"

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: caldova-recall-control/src/agent-framework-workflows-responses
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r requirements-mcp.txt

  deploy:
    name: Deploy to Microsoft Foundry (workload identity federation)
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for federated Azure login (no client secret)
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Federated Azure login (no secret)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision and deploy
        run: |
          azd env new "$AZURE_ENV_NAME" --location "$AZURE_LOCATION" \
            --subscription "$AZURE_SUBSCRIPTION_ID" --no-prompt || azd env select "$AZURE_ENV_NAME"
          azd provision --no-prompt
          azd deploy --no-prompt
        env:
          AZURE_DEV_USER_AGENT: microsoft_foundry_skill
